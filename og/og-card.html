<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Modula · Tarjeta para compartir</title>
  <!-- Fuente de img/og-modula.png (1200 × 630), la imagen que sale al compartir
       el enlace del sitio. Si cambias algo aquí, vuelve a generar el PNG con una
       captura de 1200 × 630 de esta página, después de que carguen las fuentes. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Fraunces:ital,wght@1,700&family=Plus+Jakarta+Sans:wght@500&display=block">
  <style>
    :root {
      --tinta: #0E0D1F;
      --violeta: #2D1FE8;
      --violeta-medio: #7B3FE8;
      --purpura: #9B41C8;
      --rosa: #E8336D;
      --rosa-claro: #FF6B9D;
      --teal: #00C9A7;
      --text-muted: #5E5D7C;
      --accent-text: #2D1FE8;
      --grid-line: rgba(45, 31, 232, 0.045);
      --grad-3: linear-gradient(135deg, #2D1FE8 0%, #9B41C8 45%, #E8336D 100%);
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #FFFFFF;
      color: var(--tinta);
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 64px 80px 60px;
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    /* Mismas manchas del hero */
    .blob {
      position: absolute;
      border-radius: 50%;
      opacity: 0.13;
      background: radial-gradient(circle closest-side, var(--c) 45%, transparent);
    }
    .blob--violeta { width: 820px; height: 820px; left: -300px; top: -320px; --c: var(--violeta-medio); }
    .blob--rosa    { width: 760px; height: 760px; right: -280px; top: -120px; --c: var(--rosa); }
    .blob--teal    { width: 640px; height: 640px; left: 420px; bottom: -460px; --c: var(--teal); }

    .top, .bottom {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo { display: block; height: 52px; width: auto; overflow: visible; }
    .logo text {
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
      fill: var(--tinta);
    }

    .chip {
      display: inline-flex;
      align-items: center;
      padding: 10px 22px;
      border: 1.5px solid color-mix(in srgb, var(--violeta) 28%, transparent);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.7);
      color: var(--accent-text);
      font-family: "Barlow", system-ui, sans-serif;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      position: relative;
      margin: 0;
      max-width: 1000px;
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      font-size: 70px;
      font-weight: 800;
      line-height: 1.06;
      letter-spacing: -0.035em;
    }

    .em {
      font-family: "Fraunces", Georgia, serif;
      font-style: italic;
      font-weight: 700;
      letter-spacing: -0.01em;
      background: var(--grad-3);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      padding-right: 0.06em;
    }

    .lead {
      margin: 0;
      color: var(--text-muted);
      font-size: 24px;
      font-weight: 500;
    }

    .url {
      font-family: "Barlow", system-ui, sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--tinta);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="blob blob--violeta"></div>
    <div class="blob blob--rosa"></div>
    <div class="blob blob--teal"></div>

    <div class="top">
      <svg class="logo" viewBox="0 0 99 30" role="img" aria-label="modula">
        <text x="0" y="27" font-size="27">m</text>
        <image href="../img/favicon.svg" x="25.4" y="11" width="17.6" height="17.6"/>
        <text x="43.6" y="27" font-size="27">dula</text>
      </svg>
      <span class="chip">Diseño web · Branding · Estrategia</span>
    </div>

    <h1>Tu sitio web debería <span class="em">ayudarte a conseguir clientes,</span> no solo existir en internet.</h1>

    <div class="bottom">
      <p class="lead">Sitios web y marcas para negocios que quieren crecer.</p>
      <span class="url">ismodula.com</span>
    </div>
  </div>
</body>
</html>
